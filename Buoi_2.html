<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/" href="favicon.ico">
    <title>Document</title> 
</head>
<body>

    <table style="border:1px solid black; border-collapse:separate ; border-radius: 10%;">
        <!-- dotted/double/solid -->
        <caption>Danh sách sản phẩm</caption>
        <tr>
            <th class="1">Tên sản phẩm</th>
            <th>Giá (VNĐ)</th>
            <th >Số lượng</th>
    
        </tr>
        <tr>
            <td class="style">Áo thun</td>
            <td id="4">150.000</td>
            <td>20</td>
        </tr>
        <tr>
            <td>Quần jean</td>
            <td>350.000</td>
            <td>15</td>
        </tr>
    </table>

<!-- ROWSPAN/COLSPAN -->
    <table border="1">
    <tr>
            <th rowspan="2">Học sinh</th>
            <th colspan="2">Điểm</th>
            <th rowspan="2">Trung bình</th>
        </tr>
        <tr>
            <th>Toán</th>
            <th>Văn</th>
        </tr>
        <tr>
            <td>An</td>
            <td>8</td>
            <td>9</td>
            <td>8.5</td>
        </tr>
        <tr>
            <td>Bình</td>
            <td>7</td>
            <td>8</td>
            <td>7.5</td>
        </tr>
    </table>

<!-- BLOCK & INLINE -->
    <h1> yyyyyyy <i>html</i> yyyyyyyyyyyy</h1>
    <h2> 12345678</h2>
    <i>dfghjk</i>
    <p> Để học Html. Hãy truy cập <a href="https://www.w3schools.com/html/"> W3Schools</a> để tìm hiểu thêm về HTML.</p>
    
    <!-- style="width:300px;" -->

<!-- ifame -->
    <iframe
        src="/"
        width="300"
        height="300"
        title="Trang Bán hàng">
    </iframe>
</body>
</html>
